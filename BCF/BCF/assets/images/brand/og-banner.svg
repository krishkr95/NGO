<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b12" />
      <stop offset="40%" stop-color="#1b3826" />
      <stop offset="100%" stop-color="#07120a" />
    </linearGradient>
    <linearGradient id="accent-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#e9c46a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <!-- Pattern Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200 M0 420 H1200 M0 490 H1200 M0 560 H1200" />
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630" />
  </g>
  <!-- Accent organic circles -->
  <circle cx="1050" cy="180" r="280" fill="#2d6a4f" opacity="0.25" filter="blur(60px)" />
  <circle cx="200" cy="500" r="220" fill="#e9c46a" opacity="0.12" filter="blur(50px)" />
  
  <!-- Logo Badge -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="20" fill="#2d6a4f" />
    <path d="M16 48 C24 42, 32 52, 40 46 C48 40, 52 44, 56 42" stroke="#d8f3dc" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M36 20 C36 20, 26 28, 26 37 C26 42, 30 45, 36 45 C42 45, 46 42, 46 37 C46 28, 36 20, 36 20 Z" fill="#ffffff" />
    <circle cx="36" cy="22" r="3" fill="#e9c46a" />
    <text x="92" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">BHOPAL <tspan fill="#52b788">CARES</tspan> FORUM</text>
    <text x="92" y="58" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600" fill="#a3b899" letter-spacing="0.12em">CIVIC ACTION • LAKES CONSERVATION • URBAN ECOLOGY</text>
  </g>

  <!-- Big Editorial Headline -->
  <text x="100" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
    Transforming Bhopal's Lakes
  </text>
  <text x="100" y="336" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="800" fill="url(#accent-g)" letter-spacing="-0.03em">
    One Sunday at a Time.
  </text>

  <!-- Impact Badges -->
  <g transform="translate(100, 420)">
    <rect width="210" height="90" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="24" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#52b788">4,260+ kg</text>
    <text x="24" y="68" font-family="'Inter', sans-serif" font-size="14" fill="#a3b899">Waste Cleaned</text>

    <rect x="230" width="210" height="90" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="254" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#e9c46a">2,356+</text>
    <text x="254" y="68" font-family="'Inter', sans-serif" font-size="14" fill="#a3b899">Trees Planted</text>

    <rect x="460" width="210" height="90" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="484" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#52b788">4,495</text>
    <text x="484" y="68" font-family="'Inter', sans-serif" font-size="14" fill="#a3b899">Seed Balls Thrown</text>

    <rect x="690" width="210" height="90" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="714" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#e9c46a">154+ Drives</text>
    <text x="714" y="68" font-family="'Inter', sans-serif" font-size="14" fill="#a3b899">Completed in Bhopal</text>
  </g>

  <!-- URL Tag -->
  <text x="100" y="580" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#52b788">bhopalcares.org • Join the Grassroots Movement</text>
</svg>
